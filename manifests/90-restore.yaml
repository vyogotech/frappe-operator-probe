# Rendered after the backup: ${BACKUP_DB_PATH} comes from the SiteBackup status.
apiVersion: vyogo.tech/v1
kind: SiteRestore
metadata:
  name: ${SITE}-restore-${RUN_ID}
  namespace: ${NAMESPACE}
spec:
  site: ${SITE_HOST}
  benchRef:
    name: ${BENCH}
  databaseBackupSource:
    localPath: ${BACKUP_DB_PATH}
  adminPasswordSecretRef:
    name: ${SITE}-admin-password
    key: password
  force: true
