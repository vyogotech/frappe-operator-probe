# The same app, installed from an FPM package in an OCI registry instead of
# git. The operator reads registry credentials from the optional Secret
# `fpm-registry-auth` (keys username/token) in the site's namespace.
apiVersion: vyogo.tech/v1
kind: SiteApp
metadata:
  name: ${SITE}-vyogo-probe
  namespace: ${NAMESPACE}
spec:
  siteRef:
    name: ${SITE}
  appName: vyogo_probe
  fpmPackage: ${FPM_PACKAGE}
  fpmRepo: ${FPM_REPO}
  fpmRepoType: ${FPM_REPO_TYPE}
  autoMigrate: true
  backupBeforeInstall: false
