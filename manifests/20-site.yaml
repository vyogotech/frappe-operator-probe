apiVersion: v1
kind: Secret
metadata:
  name: ${SITE}-admin-password
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  password: ${ADMIN_PASSWORD}
---
apiVersion: vyogo.tech/v1
kind: FrappeSite
metadata:
  name: ${SITE}
  namespace: ${NAMESPACE}
spec:
  benchRef:
    name: ${BENCH}
  siteName: ${SITE_HOST}
  domain: ${SITE_HOST}
  adminPasswordSecretRef:
    name: ${SITE}-admin-password
    namespace: ${NAMESPACE}
  dbConfig:
    provider: mariadb
    mode: shared
    mariadbRef:
      name: ${MARIADB_NAME}
      namespace: ${MARIADB_NAMESPACE}
  ingressClassName: ${INGRESS_CLASS}
  ingress:
    enabled: true
    className: ${INGRESS_CLASS}
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
  deletionPolicy: Delete
