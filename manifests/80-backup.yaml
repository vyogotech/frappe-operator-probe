apiVersion: vyogo.tech/v1
kind: SiteBackup
metadata:
  name: ${SITE}-backup-${RUN_ID}
  namespace: ${NAMESPACE}
spec:
  site: ${SITE_HOST}
  withFiles: true
  compress: true
  # Where the DB dump lands (the operator relocates private/backups/ to
  # private/vyogo-backups/ so Frappe's own backup rotation never removes it);
  # the SiteRestore reads the same path back.
  backupPathDB: ${BACKUP_DB_PATH}
