# The SAME app installed on a SECOND site of the bench: the operator must
# reuse the copy already on the shared volume (site-level install only, no
# fetch, no copy). Re-copying under the first site raced with its imports
# and left dangling asset links (ERPNext on the hub, 2026-09-18).
apiVersion: vyogo.tech/v1
kind: SiteApp
metadata:
  name: ${SITE}-two-vyogo-probe
  namespace: ${NAMESPACE}
spec:
  siteRef:
    name: ${SITE}-two
  appName: vyogo_probe
  gitRepo: ${PROBE_REPO}
  gitBranch: ${PROBE_BRANCH}
  autoMigrate: true
  backupBeforeInstall: false
