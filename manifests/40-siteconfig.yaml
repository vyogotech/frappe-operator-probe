apiVersion: v1
kind: Secret
metadata:
  name: ${SITE}-probe-secret
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  value: ${PROBE_SECRET}
---
apiVersion: vyogo.tech/v1
kind: SiteConfig
metadata:
  name: ${SITE}
  namespace: ${NAMESPACE}
spec:
  siteRef:
    name: ${SITE}
  maxFileSize: 10485760
  customConfig:
    probe_marker: "${PROBE_MARKER}"
  secretConfig:
    - key: probe_secret
      secretKeyRef: { name: ${SITE}-probe-secret, key: value }
