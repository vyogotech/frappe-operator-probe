# Exercise every frappe-operator CR on a kind cluster, installing vyogo_probe
# from git and from its FPM package (GHCR OCI). This is the operator's
# acceptance test; nothing here touches a real cluster.
#
# Three ways in:
#   workflow_dispatch  run it by hand against a published operator image
#   workflow_run       after "fpm package" republishes the probe app
#   workflow_call      from frappe-operator's own CI (probe-e2e.yml), which
#                      hands over the image it just built and its chart as
#                      artifacts, so every operator change is tested here
#                      before it merges.
name: e2e (kind)

on:
  workflow_dispatch:
    inputs:
      operator_ref:
        description: "frappe-operator git ref to install the chart from"
        default: "release"
      operator_image_tag:
        description: "operator image tag (ghcr.io/vyogotech/frappe-operator)"
        default: "v5.2.4"
      fpm_package:
        description: "FPM package to install in the fpm leg"
        default: "vyogotech/vyogo_probe==0.1.2"
  workflow_call:
    inputs:
      operator_ref:
        description: "frappe-operator git ref to install the chart from (ignored when operator_chart_artifact is set)"
        type: string
        default: "release"
      operator_image_tag:
        description: "operator image tag; with operator_image_artifact it is the tag inside the tarball"
        type: string
        default: "v5.2.4"
      operator_image_artifact:
        description: "artifact (from the calling run) holding a `docker save` tarball of the operator image; loaded into kind instead of pulled"
        type: string
        default: ""
      operator_chart_artifact:
        description: "artifact (from the calling run) holding helm/frappe-operator; used instead of checking the operator out"
        type: string
        default: ""
      fpm_package:
        type: string
        default: "vyogotech/vyogo_probe==0.1.2"
  workflow_run:
    workflows: ["fpm package"]
    types: [completed]

jobs:
  probe:
    # Only the workflow_run path is conditional; dispatch and workflow_call
    # (which sees the caller's event name, e.g. push/pull_request) always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        source: [git, fpm]
    env:
      # `inputs` covers workflow_dispatch and workflow_call alike; workflow_run
      # has none and takes the defaults.
      OPERATOR_REF: ${{ inputs.operator_ref || 'release' }}
      OPERATOR_TAG: ${{ inputs.operator_image_tag || 'v5.2.4' }}
      FPM_PACKAGE: ${{ inputs.fpm_package || 'vyogotech/vyogo_probe==0.1.2' }}
      IMAGE_ARTIFACT: ${{ inputs.operator_image_artifact || '' }}
      CHART_ARTIFACT: ${{ inputs.operator_chart_artifact || '' }}
    steps:
      # Explicit repository: when called from frappe-operator, the default
      # checkout would be the caller's repo.
      - uses: actions/checkout@v4
        with:
          repository: vyogotech/frappe-operator-probe
          ref: ${{ github.repository == 'vyogotech/frappe-operator-probe' && github.ref || 'main' }}
      - name: Checkout frappe-operator (${{ env.OPERATOR_REF }})
        if: env.CHART_ARTIFACT == ''
        uses: actions/checkout@v4
        with:
          repository: vyogotech/frappe-operator
          ref: ${{ env.OPERATOR_REF }}
          path: operator
      - name: Operator chart from the calling run (${{ env.CHART_ARTIFACT }})
        if: env.CHART_ARTIFACT != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHART_ARTIFACT }}
          path: operator/helm/frappe-operator
      - name: Kind cluster (ports 80/443 published)
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: probe
          config: ci/kind.yaml
      - name: Operator image from the calling run (${{ env.IMAGE_ARTIFACT }})
        if: env.IMAGE_ARTIFACT != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: /tmp/operator-image
      - name: Load that image into kind
        if: env.IMAGE_ARTIFACT != ''
        run: |
          docker load -i /tmp/operator-image/*.tar
          docker image inspect "ghcr.io/vyogotech/frappe-operator:${OPERATOR_TAG}" >/dev/null
          kind load docker-image "ghcr.io/vyogotech/frappe-operator:${OPERATOR_TAG}" --name probe
      - uses: azure/setup-helm@v4
      - name: ingress-nginx (kind flavour)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=available deploy/ingress-nginx-controller --timeout=300s
      - name: Resolve *.probe.local to ingress-nginx inside the cluster
        run: |
          # The site's own workers must reach the public hostnames (webhook target,
          # domain alias); CoreDNS rewrites them to the ingress Service.
          kubectl -n kube-system get cm coredns -o jsonpath='{.data.Corefile}' > Corefile
          sed -i 's/^\.:53 {$/.:53 {\n    rewrite name regex (.*)\\.probe\\.local ingress-nginx-controller.ingress-nginx.svc.cluster.local answer auto/' Corefile
          kubectl -n kube-system create configmap coredns --from-file=Corefile=Corefile --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n kube-system rollout restart deploy/coredns && kubectl -n kube-system rollout status deploy/coredns --timeout=120s
      - name: Install frappe-operator ${{ env.OPERATOR_TAG }}
        run: |
          helm dependency update operator/helm/frappe-operator
          helm upgrade --install frappe-operator operator/helm/frappe-operator \
            --namespace frappe-operator-system --create-namespace \
            --set mariadb-operator.enabled=true --set keda.enabled=false --set mariadb.enabled=false \
            --set operator.image.tag=${OPERATOR_TAG} --set operator.image.pullPolicy=IfNotPresent \
            --set operatorConfig.defaultDomainSuffix=.probe.local --set operatorConfig.gitEnabled=true
          for d in $(kubectl -n frappe-operator-system get deploy -o name); do kubectl -n frappe-operator-system rollout status "$d" --timeout=300s; done
      - name: MariaDB
        run: |
          kubectl apply -f ci/mariadb.yaml
          for i in $(seq 1 60); do
            st=$(kubectl -n frappe-operator-system get mariadb frappe-mariadb -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
            [ "$st" = "True" ] && break; sleep 5
          done
          kubectl -n frappe-operator-system get mariadb frappe-mariadb
      - name: Run the probe (${{ matrix.source }})
        env:
          FPM_USERNAME: ${{ github.actor }}
          FPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./probe.py --domain probe.local --site-url http://probe.probe.local --edge-ip 127.0.0.1 \
            --mariadb-ref frappe-mariadb/frappe-operator-system --ingress-class nginx --storage-size 5Gi \
            --app-source ${{ matrix.source }} --fpm-package "${FPM_PACKAGE}" --keep-going
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get frappebench,frappesite,siteapp,siteconfig,sitecron,sitemigration,sitebackup,siterestore,sitedomain -n probe -o wide || true
          kubectl get pods -A | grep -v Running || true
          echo "== ingresses"; kubectl get ingress -A -o wide || true
          echo "== alias host from the runner"; curl -sv --resolve probe-alias.probe.local:80:127.0.0.1 http://probe-alias.probe.local/api/method/vyogo_probe.api.echo_host 2>&1 | tail -15 || true
          echo "== site dirs on the bench"; kubectl -n probe exec deploy/probe-bench-gunicorn -- ls -la /home/frappe/frappe-bench/sites/ || true
          kubectl -n frappe-operator-system logs -l control-plane=controller-manager --tail=300 || true
          for j in $(kubectl -n probe get jobs -o name); do echo "== $j"; kubectl -n probe logs "$j" --tail=60 || true; done
